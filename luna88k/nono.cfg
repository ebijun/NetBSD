# Sample nono.cfg for NetBSD/luna88k liveimage
# See the following nono's online document for more details:
#  https://www.pastel-flower.jp/~isaki/nono/doc/#configuration

vmtype = luna88k

hostnet-driver = usermode
ethernet-macaddr = auto
#ethernet-macaddr = 02:00:01:88:00:01

luna-dipsw1 = 11111111
#dipsw-serial= yes
#dipsw-autoboot= no
#prom-image = luna88k-1.22.bin

hostcom0-driver = stdio

luna-video-plane = 1
ram-size = 64
#mpu-clock = 25

spc0-id5-image = cd
spc0-id6-image = hd,liveimage-netbsd-luna88k-raw-20261102.img
spc0-id6-writeignore = 1
